# Draws the link-preview cards (psalms, their verses, prayers, Bible questions) into an
# environment's R2 bucket. A Worker request may not use the ~1 s of CPU a card takes, so they are
# drawn here (scripts/og-cards.ts); only changed ones redraw.
# To save GitHub's free minutes it runs only when cards can have changed: after a production sync
# (new or edited posts), when the card design changes, or by hand. One job, one environment.
name: Link-preview cards

on:
  workflow_run:
    workflows: ["Cloud sync"]
    types: [completed]
  push:
    branches: [main, staging]
    paths: ["scripts/og-cards.ts", "app/utils/og-card-layout.ts", "app/assets/og-fonts/**", "app/assets/og-initials/**", ".github/workflows/og-cards.yml"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Which site's cards to draw"
        type: choice
        options: [production, staging]
        default: production
      force:
        description: "Draw every card again"
        type: boolean
        default: false

concurrency:
  group: og-cards
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  draw:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # A push to staging draws staging; a sync and a push to main draw production; by hand, as chosen.
      TARGET: ${{ inputs.environment || (github.event_name == 'push' && github.ref_name == 'staging' && 'staging') || 'production' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Draw cards
        run: |
          if [ "$TARGET" = "staging" ]; then export OG_SITE=https://staging.apostolic.am OG_BUCKET=armenian-apostolic-library-media-staging
          else export OG_SITE=https://apostolic.am OG_BUCKET=armenian-apostolic-library-media-production; fi
          node --import tsx scripts/og-cards.ts ${{ inputs.force && '--force' || '' }}
