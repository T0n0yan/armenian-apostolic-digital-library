# Draws the link-preview cards (psalms, their verses, prayers, Bible questions) into each
# environment's R2 bucket after every Telegram sync and deploy. A Worker request may not use the
# ~1 s of CPU a card takes, so they are drawn here (scripts/og-cards.ts); only changed ones redraw.
name: Link-preview cards

on:
  # Run after a successful deployment/sync; avoid the duplicate push job.
  workflow_run:
    workflows: ["Cloud sync", "Deploy"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: "Draw every card again"
        type: boolean
        default: false

concurrency:
  group: og-cards
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  draw:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - environment: production
            site: https://apostolic.am
            bucket: armenian-apostolic-library-media-production
          - environment: staging
            site: https://staging.apostolic.am
            bucket: armenian-apostolic-library-media-staging
    env:
      OG_SITE: ${{ matrix.site }}
      OG_BUCKET: ${{ matrix.bucket }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        # A deployment draws its own environment; a sync (production only now) draws production; a manual run both.
        if: github.event_name != 'workflow_run' || (github.event.workflow_run.name == 'Deploy' && (github.event.workflow_run.head_branch == 'staging') == (matrix.environment == 'staging')) || (github.event.workflow_run.name != 'Deploy' && matrix.environment == 'production')
      - uses: pnpm/action-setup@v4
        if: github.event_name != 'workflow_run' || (github.event.workflow_run.name == 'Deploy' && (github.event.workflow_run.head_branch == 'staging') == (matrix.environment == 'staging')) || (github.event.workflow_run.name != 'Deploy' && matrix.environment == 'production')
      - uses: actions/setup-node@v4
        if: github.event_name != 'workflow_run' || (github.event.workflow_run.name == 'Deploy' && (github.event.workflow_run.head_branch == 'staging') == (matrix.environment == 'staging')) || (github.event.workflow_run.name != 'Deploy' && matrix.environment == 'production')
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        if: github.event_name != 'workflow_run' || (github.event.workflow_run.name == 'Deploy' && (github.event.workflow_run.head_branch == 'staging') == (matrix.environment == 'staging')) || (github.event.workflow_run.name != 'Deploy' && matrix.environment == 'production')
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Draw cards
        if: github.event_name != 'workflow_run' || (github.event.workflow_run.name == 'Deploy' && (github.event.workflow_run.head_branch == 'staging') == (matrix.environment == 'staging')) || (github.event.workflow_run.name != 'Deploy' && matrix.environment == 'production')
        run: node --import tsx scripts/og-cards.ts ${{ inputs.force && '--force' || '' }}
