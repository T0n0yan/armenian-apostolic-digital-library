# Draws the link-preview cards (psalms, their verses, prayers, Bible questions) into each
# environment's R2 bucket after every Telegram sync and deploy. A Worker request may not use the
# ~1 s of CPU a card takes, so they are drawn here (scripts/og-cards.ts); only changed ones redraw.
name: Link-preview cards

on:
  # A push draws that branch's environment once its deploy is up (staging → staging, main → production).
  push:
    branches: [staging, main]
  workflow_run:
    workflows: ["Cloud sync", "Deploy"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: "Draw every card again"
        type: boolean
        default: false

concurrency:
  group: og-cards
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - environment: production
            site: https://apostolic.am
            bucket: armenian-apostolic-library-media-production
          - environment: staging
            site: https://staging.apostolic.am
            bucket: armenian-apostolic-library-media-staging
    # A push only draws its own environment; a sync or a manual run draws both.
    if: github.event_name != 'push' || (github.ref_name == 'staging') == (matrix.environment == 'staging')
    env:
      OG_WAIT: ${{ github.event_name == 'push' && '1' || '' }}
      OG_SITE: ${{ matrix.site }}
      OG_BUCKET: ${{ matrix.bucket }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TELEGRAM_BRIDGE_SHARED_SECRET: ${{ secrets.TELEGRAM_BRIDGE_SHARED_SECRET }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Draw cards
        run: node --import tsx scripts/og-cards.ts ${{ inputs.force && '--force' || '' }}
