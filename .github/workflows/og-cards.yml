# Draws the link-preview cards (psalms, their verses, prayers, Bible questions) into an
# environment's R2 bucket. A Worker request may not use the ~1 s of CPU a card takes, so they are
# drawn here (scripts/og-cards.ts); only changed ones redraw.
# Deploy-triggered cards wait for a successful deployment. Cloud sync draws its own target
# in the already-installed job, avoiding another checkout/install and incorrect staging targets.
name: Link-preview cards

on:
  workflow_run:
    workflows: ["Deploy"]
    branches: [main, staging]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: "Which site's cards to draw"
        type: choice
        options: [production, staging]
        default: production
      force:
        description: "Draw every card again"
        type: boolean
        default: false

concurrency:
  group: og-cards
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  draw:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # A completed staging deploy draws staging; a main deploy draws production.
      TARGET: ${{ inputs.environment || (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Deploy' && github.event.workflow_run.head_branch == 'staging' && 'staging') || 'production' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Draw cards
        run: |
          if [ "$TARGET" = "staging" ]; then export OG_SITE=https://staging.apostolic.am OG_BUCKET=armenian-apostolic-library-media-staging
          else export OG_SITE=https://apostolic.am OG_BUCKET=armenian-apostolic-library-media-production; fi
          node --import tsx scripts/og-cards.ts ${{ inputs.force && '--force' || '' }}
