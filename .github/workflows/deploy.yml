# Deploys the site from GitHub: the `staging` branch to staging, `main` to production.
# Every deploy runs the tests, applies new database migrations to that environment, then
# builds and deploys its Worker. Production therefore changes only when something is merged
# into `main`; everything is tried on `staging` first (docs/ENVIRONMENTS.md).
name: Deploy

on:
  push:
    branches: [main, staging]
    # Notes and plans (docs/work/, CLAUDE.md) change often and need no deploy.
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Built once, for the target; the tests run against that same build (saves a second build).
      - name: Build
        run: CLOUDFLARE_ENV="$TARGET" pnpm run build
      - name: Test
        run: pnpm exec tsx --test tests/*.test.ts
      - name: Apply database migrations
        run: pnpm exec wrangler d1 migrations apply "armenian-apostolic-digital-library-$TARGET" --env "$TARGET" --remote
      # Once, while production has no OpenStreetMap places: bring them in hidden, so the map stays
      # empty until the admin shows the ones wanted (/admin/places). Later deploys skip this.
      - name: OpenStreetMap places, hidden (production, first time only)
        if: env.TARGET == 'production'
        # The import reads OpenStreetMap; if that is down, the deploy still goes ahead.
        continue-on-error: true
        run: |
          count=$(pnpm exec wrangler d1 execute "armenian-apostolic-digital-library-$TARGET" --env "$TARGET" --remote --json --command "SELECT COUNT(*) AS n FROM places WHERE osm_id IS NOT NULL" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s)[0].results[0].n))')
          echo "OpenStreetMap places already there: $count"
          if [ "$count" = "0" ]; then
            python3 scripts/import-osm-places.py --hidden > osm-places.sql
            pnpm exec wrangler d1 execute "armenian-apostolic-digital-library-$TARGET" --env "$TARGET" --remote --file osm-places.sql
          fi
      - name: Deploy
        run: pnpm exec wrangler deploy --env "$TARGET"
