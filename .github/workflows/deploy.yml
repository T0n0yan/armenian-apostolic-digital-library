# Deploys the site from GitHub: the `staging` branch to staging, `main` to production.
# Every deploy runs the tests, applies new database migrations to that environment, then
# builds and deploys its Worker. Production therefore changes only when something is merged
# into `main`; everything is tried on `staging` first (docs/ENVIRONMENTS.md).
name: Deploy

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Apply database migrations
        run: pnpm exec wrangler d1 migrations apply "armenian-apostolic-digital-library-$TARGET" --env "$TARGET" --remote
      - name: Build
        run: CLOUDFLARE_ENV="$TARGET" pnpm run build
      - name: Deploy
        run: pnpm exec wrangler deploy --env "$TARGET"
