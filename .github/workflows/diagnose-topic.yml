# Read-only: lists one Telegram topic's posts next to what the site's database holds for each,
# to find why a post is missing on the site (services/telegram-bridge/src/diagnose-topic.ts).
name: Diagnose topic

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Part of the topic's name, e.g. Աղոթք"
        required: true
      environment:
        type: choice
        options: [production, staging]
        default: production

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUD_SYNC_ENV: ${{ inputs.environment }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
      TELEGRAM_BRIDGE_SHARED_SECRET: ${{ secrets.TELEGRAM_BRIDGE_SHARED_SECRET }}
      TELEGRAM_ALLOWED_CHAT_IDS: ${{ vars.TELEGRAM_CONTENT_CHAT_ID }}
      TELEGRAM_CONTENT_CHAT_ID: ${{ vars.TELEGRAM_CONTENT_CHAT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Compare Telegram and the database
        run: node --import tsx services/telegram-bridge/src/diagnose-topic.ts "${{ inputs.topic }}"
