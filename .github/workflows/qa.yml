name: QA review
on:
  pull_request:
    branches: [main, staging]
    # Notes and plans need no checks (each run costs GitHub's free minutes).
    paths-ignore: ["**.md", "docs/**"]
permissions:
  contents: read
concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04 # 26.04-ում Playwright-ը չի տեղադրվում
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Բրաուզերի տեղադրում
        # apt-ի ցանցային սխալի դեպքում՝ ևս երկու փորձ (2026-11-11-ին մեկ սխալից QA-ն բրաուզերին չհասավ)։
        timeout-minutes: 8
        run: |
          for attempt in 1 2 3; do
            if pnpm exec playwright install --with-deps chromium; then exit 0; fi
            echo "Տեղադրումը չստացվեց (փորձ $attempt/3)"; sleep 20
          done
          exit 1
      - name: Տեղական բազա և բրաուզերային ստուգումներ
        run: |
          pnpm db:migrate:local
          python3 scripts/qa-ui-fixture.py
          pnpm exec vite preview --host 127.0.0.1 --port 5173 > /tmp/qa-dev.log 2>&1 &
          qa_server_pid=$!
          trap 'kill "$qa_server_pid" || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/psalms > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/psalms > /dev/null
          node scripts/qa-ui-smoke.mjs
      - name: Ձախողման նյութերը
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure
          path: |
            .local-artifacts/qa-review
            /tmp/qa-dev.log
          retention-days: 7
