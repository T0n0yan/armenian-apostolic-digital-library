name: QA review
on:
  pull_request:
    branches: [main, staging]
    # Notes and plans need no checks (each run costs GitHub's free minutes).
    paths-ignore: ["**.md", "docs/**"]
permissions:
  contents: read
concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Բրաուզերի տեղադրում
        run: pnpm exec playwright install --with-deps chromium
      - name: Տեղական բազա և բրաուզերային ստուգումներ
        run: |
          pnpm db:migrate:local
          python3 scripts/qa-ui-fixture.py
          pnpm dev --host 127.0.0.1 --port 5173 > /tmp/qa-dev.log 2>&1 &
          qa_server_pid=$!
          trap 'kill "$qa_server_pid" || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/psalms > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/psalms > /dev/null
          node scripts/qa-ui-smoke.mjs
