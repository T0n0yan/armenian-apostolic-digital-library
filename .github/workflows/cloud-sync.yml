# Telegram → Cloudflare sync for both sites. Reconciles the content forum into each environment's
# D1/R2: new and edited posts appear, deleted ones are taken down. Started every 30 minutes by the
# Workers' cron (GitHub's own schedule below is only a fallback). Free within GitHub's minutes.
name: Cloud sync

on:
  schedule:
    # Minute 17 avoids the top-of-hour rush on GitHub's scheduler.
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: cloud-sync-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    # The first sync of an empty environment uploads all media and can take an hour.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # One after the other: both read the same Telegram account, which dislikes parallel logins.
      max-parallel: 1
      matrix:
        environment: [production, staging]
    env:
      CLOUD_SYNC_ENV: ${{ matrix.environment }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
      TELEGRAM_BRIDGE_SHARED_SECRET: ${{ secrets.TELEGRAM_BRIDGE_SHARED_SECRET }}
      TELEGRAM_ALLOWED_CHAT_IDS: ${{ vars.TELEGRAM_CONTENT_CHAT_ID }}
      TELEGRAM_CONTENT_CHAT_ID: ${{ vars.TELEGRAM_CONTENT_CHAT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Reconcile Telegram into Cloudflare
        run: node --import tsx services/telegram-bridge/src/cloud-import.ts reconcile
