# Telegram → Cloudflare sync. Automatic runs (the Worker's dispatch, the nightly schedule) sync
# production only; staging is synced by hand (environment: staging) when something needs trying.
# Reconciles the content forum into the environment's
# D1/R2: new and edited posts appear, deleted ones are taken down. Started by production's Worker
# 15 minutes after the last new or edited post in the group (the bot's webhook and its Clock,
# workers/clock.ts) and once a night by its cron, for deletions; GitHub's own schedule below is
# only a fallback. Free within GitHub's minutes.
name: Cloud sync

on:
  schedule:
    # Once a day, after the Worker's nightly run (00:17 UTC); minute 47 avoids the top-of-hour rush.
    - cron: "47 1 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: "Which site to sync. Staging is only synced by hand, to keep its data and load small."
        type: choice
        options: [production, staging, both]
        default: production
      mode:
        description: "reconcile changes the site; dry-run only reports what it would do"
        type: choice
        options: [reconcile, dry-run]
        default: reconcile

concurrency:
  group: cloud-sync-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    # The first sync of an empty environment uploads all media and can take an hour.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # One after the other: both read the same Telegram account, which dislikes parallel logins.
      max-parallel: 1
      matrix:
        environment: [production, staging]
    env:
      CLOUD_SYNC_ENV: ${{ matrix.environment }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
      TELEGRAM_BRIDGE_SHARED_SECRET: ${{ secrets.TELEGRAM_BRIDGE_SHARED_SECRET }}
      TELEGRAM_ALLOWED_CHAT_IDS: ${{ vars.TELEGRAM_CONTENT_CHAT_ID }}
      TELEGRAM_CONTENT_CHAT_ID: ${{ vars.TELEGRAM_CONTENT_CHAT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        if: (github.event_name == 'workflow_dispatch' && (inputs.environment == 'both' || inputs.environment == matrix.environment)) || ((github.event_name != 'workflow_dispatch' || inputs.environment == '') && matrix.environment == 'production')
      - uses: pnpm/action-setup@v4
        if: (github.event_name == 'workflow_dispatch' && (inputs.environment == 'both' || inputs.environment == matrix.environment)) || ((github.event_name != 'workflow_dispatch' || inputs.environment == '') && matrix.environment == 'production')
      - uses: actions/setup-node@v4
        if: (github.event_name == 'workflow_dispatch' && (inputs.environment == 'both' || inputs.environment == matrix.environment)) || ((github.event_name != 'workflow_dispatch' || inputs.environment == '') && matrix.environment == 'production')
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        if: (github.event_name == 'workflow_dispatch' && (inputs.environment == 'both' || inputs.environment == matrix.environment)) || ((github.event_name != 'workflow_dispatch' || inputs.environment == '') && matrix.environment == 'production')
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Reconcile Telegram into Cloudflare
        if: (github.event_name == 'workflow_dispatch' && (inputs.environment == 'both' || inputs.environment == matrix.environment)) || ((github.event_name != 'workflow_dispatch' || inputs.environment == '') && matrix.environment == 'production')
        run: node --import tsx services/telegram-bridge/src/cloud-import.ts ${{ inputs.mode == 'dry-run' && 'dry-run' || 'reconcile' }}
