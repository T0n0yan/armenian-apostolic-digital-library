# Encrypted D1 backups go only to a separately configured private R2 bucket. No public artifacts.
name: Private database backup
on:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * 0'
permissions:
  contents: read
concurrency:
  group: private-database-backup
  cancel-in-progress: false
jobs:
  backup:
    if: vars.BACKUP_AGE_RECIPIENT != '' && vars.BACKUP_R2_BUCKET != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: sudo apt-get update && sudo apt-get install -y age
      - name: Export, encrypt and upload
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_TOKEN }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
          BACKUP_R2_BUCKET: ${{ vars.BACKUP_R2_BUCKET }}
          WRANGLER_SEND_METRICS: 'false'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [[ "$BACKUP_R2_BUCKET" == armenian-apostolic-library-media-* ]]; then
            echo 'Refusing a public media bucket'; exit 1
          fi
          backup_dir=$(mktemp -d)
          trap 'rm -rf "$backup_dir"' EXIT
          db=armenian-apostolic-digital-library-production
          # D1-ի export-ը չի կարող վերցնել FTS5 վիրտուալ աղյուսակները. վերցնում ենք բոլոր իրական
          # աղյուսակները, բացի որոնման ինդեքսից (library_search_fts*)՝ այն ածանցյալ է և վերականգնելիս
          # նորից է կառուցվում library_search_documents-ից։
          tables=$(pnpm exec wrangler d1 execute "$db" --env production --remote --json \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'library_search_fts%' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%' ORDER BY name" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=JSON.parse(s);const rows=(Array.isArray(r)?r[0].results:r.result[0].results);process.stdout.write(rows.map(x=>x.name).join(' '))})")
          table_args=""
          for t in $tables; do table_args="$table_args --table $t"; done
          echo "Backing up tables: $tables"
          pnpm exec wrangler d1 export "$db" --env production --remote $table_args --output "$backup_dir/database.sql"
          age -r "$BACKUP_AGE_RECIPIENT" -o "$backup_dir/database.sql.age" "$backup_dir/database.sql"
          rm "$backup_dir/database.sql"
          pnpm exec wrangler r2 object put "$BACKUP_R2_BUCKET/d1/$(date -u +%Y-%m-%dT%H-%M-%SZ).sql.age" --remote --file "$backup_dir/database.sql.age" --content-type application/octet-stream
