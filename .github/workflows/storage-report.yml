# Միայն կարդում է. ինչով է լցված R2 պահեստը և D1 բազաները (scripts/storage-report.mjs)։
# Գործարկել ձեռքով՝ Actions → Storage report → Run workflow. արդյունքը՝ գործարկման Summary-ում։
name: Storage report

on:
  workflow_dispatch:
    inputs:
      report:
        description: "Հաշվետվության տեսակը"
        type: choice
        default: storage
        options:
          - storage
          - media

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # v5-ը package.json-ի packageManager-ից ինքն է միացնում pnpm-ի cache-ը, իսկ այստեղ pnpm չկա
          package-manager-cache: false
      - if: inputs.report != 'media'
        run: node scripts/storage-report.mjs
      - if: inputs.report == 'media'
        run: node scripts/media-reuse-report.mjs
      - if: inputs.report == 'media'
        uses: actions/upload-artifact@v4
        with:
          name: media-reuse-report
          path: media-reuse-report.json
          retention-days: 7
